name: Publish Agent Trust Receipt MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "registry/agent-trust/server.json"
      - ".github/workflows/publish-agent-trust-registry.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-agent-trust-receipt-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Verify live Trust MCP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'x-akari-internal-test: 1' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ai-akari-registry-publisher","version":"1.1.0"}}}' \
            https://ai-akari.ai/mcp-trust > /tmp/initialize.json
          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'x-akari-internal-test: 1' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            https://ai-akari.ai/mcp-trust > /tmp/tools.json
          jq -e '.result.protocolVersion == "2025-06-18"' /tmp/initialize.json >/dev/null
          jq -e '.result.tools | any(.name == "get_agent_trust_receipt")' /tmp/tools.json >/dev/null

      - name: Install official publisher
        shell: bash
        run: |
          set -euo pipefail
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Check exact version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL 'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.AInoAKARI%2Fagent-trust-receipt')"
          FOUND="$(printf '%s' "$RESPONSE" | jq '[.servers[] | select(.server.name == "io.github.AInoAKARI/agent-trust-receipt" and .server.version == "1.1.0")] | length')"
          if [ "$FOUND" -ge 1 ]; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with GitHub OIDC
        if: steps.check.outputs.already != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.check.outputs.already != 'true'
        run: ./mcp-publisher publish registry/agent-trust/server.json

      - name: Verify official discovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            RESPONSE="$(curl -fsSL 'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.AInoAKARI%2Fagent-trust-receipt')"
            COUNT="$(printf '%s' "$RESPONSE" | jq '[.servers[] | select(.server.name == "io.github.AInoAKARI/agent-trust-receipt" and .server.version == "1.1.0")] | length')"
            if [ "$COUNT" -ge 1 ]; then
              echo 'Official MCP Registry publication verified.'
              echo 'This is distribution evidence, not revenue or organic adoption.'
              exit 0
            fi
            sleep 10
          done
          exit 1
